name: Deploy account and sync server
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: stat-tracker-server
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Check deployment access
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Add CLOUDFLARE_API_TOKEN in repository Actions secrets"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Add CLOUDFLARE_ACCOUNT_ID in repository Actions secrets"; exit 1; }
      - run: npm ci
      - run: npm test
      - name: Add account security table without changing existing data
        run: npx wrangler d1 execute stat-tracker --remote --file security-migration.sql
      - name: Add optional sign-in methods
        run: npx wrangler d1 execute stat-tracker --remote --file signin-migration.sql
      - name: Add Auth0 account linking
        run: npx wrangler d1 execute stat-tracker --remote --file auth0-migration.sql
      - name: Add team and sport assignments for coaches
        run: npx wrangler d1 execute stat-tracker --remote --file coach-migration.sql
      - name: Add Owner accounts and private activity boundaries
        run: npx wrangler d1 execute stat-tracker --remote --file owner-migration.sql

      - name: Preserve or initialize the authenticator encryption key
        run: node configure-mfa-key.mjs
      - name: Configure optional email and SMS delivery
        env:
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_VERIFY_SERVICE_SID: ${{ secrets.TWILIO_VERIFY_SERVICE_SID }}
          SIGNIN_EMAIL: ${{ vars.SIGNIN_EMAIL }}
          SIGNIN_SMS: ${{ vars.SIGNIN_SMS }}
        run: node configure-signin.mjs
      - name: Deploy Worker
        run: npx wrangler deploy
