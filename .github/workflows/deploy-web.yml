name: Deploy web build to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prepare download page files
        shell: python
        run: |
          from pathlib import Path
          import shutil

          destination = Path("web-downloads")
          source = destination if destination.is_dir() else Path(".")
          filenames = ("index.html", "config.js", "downloads.js", "styles.css")
          missing = [name for name in filenames if not (source / name).is_file()]
          if missing:
              raise SystemExit(f"Missing download page files in {source}: {', '.join(missing)}")
          html = (source / "index.html").read_text(encoding="utf-8-sig")
          if 'downloads.js' not in html or 'android-action' not in html:
              raise SystemExit(f"{source / 'index.html'} is not the Stat Tracker download page.")
          if source != destination:
              destination.mkdir(parents=True, exist_ok=True)
              for name in filenames:
                  shutil.copy2(source / name, destination / name)
          print(f"Download page ready: four files from {source}")

      - name: Install Flet build tooling
        run: pip install "flet[all]==0.86.5"

      - name: Build web app
        run: flet build web --project "Stat Tracker" --base-url "" --yes

      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - name: Preserve custom domain (CNAME) if configured
        run: |
          if [ -f "CNAME" ]; then
            cp CNAME build/web/CNAME
          fi

      - name: Include native app download page
        run: |
          mkdir -p build/web/downloads
          cp web-downloads/index.html web-downloads/config.js web-downloads/downloads.js web-downloads/styles.css build/web/downloads/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
