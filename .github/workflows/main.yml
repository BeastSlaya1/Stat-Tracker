name: Deploy web build to GitHub Pages

# Why this exists: a phone opening the web build always needs SOMETHING
# serving it over http(s) — that's just how browsers work, not a
# limitation specific to this app. The previous run_web_lan*.bat scripts
# make *this computer* that something, which only works while the PC is
# on, awake, and running the script, and only for phones on the same
# WiFi. GitHub Pages is a free, always-on static host instead: once this
# workflow runs, the site lives at a permanent https:// URL that any
# phone (or anyone else) can open directly, anytime, on any network — no
# PC, no LAN, nothing else needs to be running.
#
# One-time setup after pushing this repo to GitHub:
#   1. Repo Settings → Pages → Source → set to "GitHub Actions".
#   2. Push to the "main" branch (or run this workflow manually from the
#      Actions tab) — it builds the web app and publishes it.
#   3. The Actions tab (or Settings → Pages) will show the live URL,
#      something like: https://<your-username>.github.io/<repo-name>/
#      Open that directly on an iPhone or Android phone's browser —
#      that's the whole point, no other device required.
#
# Every future push to "main" re-deploys automatically. flet build web
# uses Flutter under the hood (same as building for Windows/Android), and
# manages its own pinned copy of the Flutter SDK automatically the first
# time it runs — nothing to install locally for this specific workflow,
# it happens as part of the "Build web app" step below.

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}   # lets you also trigger a rebuild manually from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flet build tooling
        run: pip install "flet[all]==0.86.5"

      # No separate Flutter install step: flet build web pins its own
      # exact required Flutter SDK version internally (3.44.8 as of this
      # writing) and downloads/manages that itself the first time it
      # runs, into its own cache — a Flutter SDK installed some other way
      # (e.g. via subosito/flutter-action, which installs whatever
      # "stable" currently resolves to) can easily be a *different*
      # version than flet build web actually wants, and it will refuse to
      # just use a mismatched one silently.
      #
      # --base-url matters specifically for GitHub Pages: the site is
      # served from https://<username>.github.io/<repo-name>/ (a
      # subpath), not the domain root, so every asset URL the built app
      # requests needs that repo-name prefix or they'll all 404. Using
      # github.event.repository.name here means this always matches
      # whatever this repo is actually named, with nothing to hardcode
      # or keep in sync by hand if it's ever renamed.
      #
      # --yes answers "yes" to flet build web's own prompt to install
      # that Flutter SDK version itself when it's missing/mismatched.
      # Without it, the prompt just hangs waiting for a keypress that can
      # never come in CI (there's no terminal attached to answer it),
      # which is exactly what was failing before this flag was added —
      # "EOFError: EOF when reading a line" from the build log means
      # precisely this: a real interactive prompt with nothing able to
      # answer it.
      - name: Build web app
        run: flet build web --project "Stat Tracker" --base-url "${{ github.event.repository.name }}" --yes

      # GitHub Pages runs everything through Jekyll by default, which
      # ignores/mishandles some of the files flet build web produces —
      # .nojekyll turns that off so the site is served byte-for-byte as
      # flet built it.
      - name: Disable Jekyll processing
        run: touch build/web/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
